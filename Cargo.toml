[package]
name = "dominion"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/alexander-vox/Dominion"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
shadcn-egui = "0.8"
egui_extras = { version = "0.37", default-features = false }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
